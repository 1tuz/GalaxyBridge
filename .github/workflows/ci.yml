name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      android: ${{ steps.scope.outputs.android }}
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: scope
        name: Select affected platforms
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            printf 'code=true\nandroid=true\nmacos=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$PUSH_BEFORE"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi
          git diff --name-only "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          cat "$RUNNER_TEMP/changed-files.txt"

          python3 - "$RUNNER_TEMP/changed-files.txt" "$EVENT_NAME" <<'PY'
          from pathlib import Path
          import sys

          files = [line.strip() for line in Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          event = sys.argv[2]

          def starts(path, prefixes):
              return any(path == prefix or path.startswith(prefix) for prefix in prefixes)

          common = (
              'protocol/',
              'CMakeLists.txt',
              'CMakePresets.json',
              'scripts/public-build.py',
              'scripts/bootstrap-build-tools.py',
              'scripts/build-tools-requirements.txt',
              '.github/workflows/ci.yml',
              '.github/workflows/build-android.yml',
              '.github/workflows/build-macos.yml',
          )
          android_only = (
              'android/',
              'scripts/package-android-',
              'scripts/test-android-',
          )
          macos_only = (
              'macos/',
              'Sources/',
              'native/',
              'third_party/',
              'Package.swift',
              'Package.resolved',
              'scripts/build-owned-adb.sh',
              'scripts/build-quic-backend.sh',
              'scripts/build-scrcpy-gb-sync.sh',
              'scripts/native-build-env.sh',
              'scripts/package-macos-',
              'scripts/test-macos-',
          )

          code = any(starts(path, common + android_only + macos_only) for path in files)
          android = any(starts(path, common + android_only) for path in files)
          macos = any(starts(path, common + macos_only) for path in files)

          # A main-branch build publishes one coherent APK+DMG release. If code
          # changed, build both platforms at the same commit. PRs stay path-aware.
          if event == 'push' and code:
              android = True
              macos = True

          with open(Path.cwd() / '.ci-scope', 'w') as output:
              output.write(f'code={str(code).lower()}\n')
              output.write(f'android={str(android).lower()}\n')
              output.write(f'macos={str(macos).lower()}\n')
          PY
          cat .ci-scope >> "$GITHUB_OUTPUT"
          rm .ci-scope

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/build-android.yml
    with:
      release_artifacts: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      GB_ANDROID_DIRECT_KEYSTORE: ${{ secrets.GB_ANDROID_DIRECT_KEYSTORE }}
      GB_ANDROID_DIRECT_KEYSTORE_PASSWORD: ${{ secrets.GB_ANDROID_DIRECT_KEYSTORE_PASSWORD }}
      GB_ANDROID_DIRECT_KEY_ALIAS: ${{ secrets.GB_ANDROID_DIRECT_KEY_ALIAS }}
      GB_ANDROID_DIRECT_KEY_PASSWORD: ${{ secrets.GB_ANDROID_DIRECT_KEY_PASSWORD }}

  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    uses: ./.github/workflows/build-macos.yml
    with:
      release_artifacts: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  publish:
    name: Publish release
    needs: [changes, android, macos]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.code == 'true' &&
      needs.android.result == 'success' &&
      needs.macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find dist -type f \( -name '*.apk' -o -name '*.dmg' -o -name '*.sha256' -o -name '*.signature.txt' -o -name 'SHA256SUMS' \) \
            -exec cp -v {} release-assets/ \;
          ls -la release-assets
          test "$(find release-assets -type f | wc -l)" -gt 0

      - name: Publish continuous GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: continuous
          name: Continuous build
          prerelease: true
          make_latest: true
          body: |
            Latest successful lightweight `main` build.

            - Commit: `${{ github.sha }}`
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Full regression coverage: Nightly Heavy workflow

            Android Direct APK and macOS arm64 DMG are attached below.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
