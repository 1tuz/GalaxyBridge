name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      android: ${{ steps.scope.outputs.android }}
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: scope
        name: Select affected platforms
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            printf 'code=true\nandroid=true\nmacos=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$PUSH_BEFORE"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi
          git diff --name-only "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          cat "$RUNNER_TEMP/changed-files.txt"

          python3 - "$RUNNER_TEMP/changed-files.txt" "$EVENT_NAME" <<'PY'
          from pathlib import Path
          import sys

          files = [line.strip() for line in Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          event = sys.argv[2]

          def starts(path, prefixes):
              return any(path == prefix or path.startswith(prefix) for prefix in prefixes)

          common = (
              'protocol/',
              'CMakeLists.txt',
              'CMakePresets.json',
              'scripts/public-build.py',
              'scripts/bootstrap-build-tools.py',
              'scripts/build-tools-requirements.txt',
              '.github/workflows/ci.yml',
          )
          android_only = (
              'android/',
              'scripts/package-android-',
              'scripts/test-android-',
          )
          macos_only = (
              'macos/',
              'Sources/',
              'native/',
              'third_party/',
              'Package.swift',
              'Package.resolved',
              'scripts/build-owned-adb.sh',
              'scripts/build-quic-backend.sh',
              'scripts/build-scrcpy-gb-sync.sh',
              'scripts/native-build-env.sh',
              'scripts/package-macos-',
              'scripts/test-macos-',
          )

          code = any(starts(path, common + android_only + macos_only) for path in files)
          android = any(starts(path, common + android_only) for path in files)
          macos = any(starts(path, common + macos_only) for path in files)

          # A main-branch build publishes one coherent APK+DMG release. If code
          # changed, build both platforms at the same commit. PRs stay path-aware.
          if event == 'push' and code:
              android = True
              macos = True

          with open(Path.cwd() / '.ci-scope', 'w') as output:
              output.write(f'code={str(code).lower()}\n')
              output.write(f'android={str(android).lower()}\n')
              output.write(f'macos={str(macos).lower()}\n')
          PY
          cat .ci-scope >> "$GITHUB_OUTPUT"
          rm .ci-scope

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      BUILD_DIR: out/macos-arm64-release
      GRADLE_USER_HOME: ${{ github.workspace }}/out/macos-arm64-release/dependency-cache/gradle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check publication hygiene
        run: python3 scripts/check-public-tree.py

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android cache directories
        run: |
          mkdir -p \
            "$BUILD_DIR/dependency-cache/gradle" \
            "$BUILD_DIR/tools"

      - name: Cache Gradle + build tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/macos-arm64-release/dependency-cache/gradle
            out/macos-arm64-release/tools
          key: android-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'scripts/build-tools-requirements.txt') }}
          restore-keys: |
            android-deps-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Android SDK + build tools
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' \
            'build-tools;37.0.0'
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          python3 scripts/bootstrap-build-tools.py --build-dir "$BUILD_DIR"
          echo "$PWD/$BUILD_DIR/tools/bin" >> "$GITHUB_PATH"

      - name: Configure CMake
        run: cmake --preset macos-arm64-release -DGB_BUILD_JOBS=4

      - name: Fast Android contract check
        working-directory: android
        run: |
          ./gradlew --no-daemon --console=plain \
            :app:testDirectDebugUnitTest --tests '*FileSendPolicyTest'

      - name: Build Direct APK
        run: cmake --build --preset macos-arm64-release --target android-apk

      - name: Collect Android artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p out/artifacts-android
          find out/macos-arm64-release/artifacts -maxdepth 1 -name 'GalaxyBridge-*.apk*' -exec cp {} out/artifacts-android/ \;
          ls -la out/artifacts-android
          mkdir -p "$BUILD_DIR/dependency-cache/gradle" "$BUILD_DIR/tools"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: android-direct
          path: out/artifacts-android/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GB_BUILD_JOBS: '4'
      RUSTUP_TOOLCHAIN: '1.92.0'
      BUILD_DIR: out/macos-arm64-release
      CARGO_HOME: ${{ github.workspace }}/out/macos-arm64-release/dependency-cache/cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check publication hygiene
        run: python3 scripts/check-public-tree.py

      # Exact-key only: never restore a partial/stale native binary set.
      - id: native-cache
        name: Restore native artifacts cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/macos-arm64-release/artifacts/adb
            out/macos-arm64-release/artifacts/scrcpy
            out/macos-arm64-release/artifacts/quic-backend
          key: macos-native-v4-${{ runner.os }}-${{ runner.arch }}-rust1.92.0-ndk29.0.14206865-${{ hashFiles('native/galaxybridge-quic/**', 'native/galaxybridge-quic-backend/**', 'native/galaxybridge-quic-media/**', 'third_party/adb-owned/**', 'third_party/scrcpy/**', 'third_party/scrcpy-gb-sync/**', 'scripts/build-owned-adb.sh', 'scripts/build-quic-backend.sh', 'scripts/build-scrcpy-gb-sync.sh', 'scripts/native-build-env.sh', 'scripts/stage-redistributable-adb.py') }}

      - id: native
        name: Validate cached native artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR/artifacts"
          if [[ "${{ steps.native-cache.outputs.cache-hit }}" == 'true' ]]; then
            if python3 scripts/public-build.py validate-native --build-dir "$BUILD_DIR"; then
              echo 'reuse=true' >> "$GITHUB_OUTPUT"
              echo 'GB_REUSE_NATIVE_ARTIFACTS=1' >> "$GITHUB_ENV"
              echo 'Validated native cache hit; skipping Java/Android SDK/NDK/Rust toolchains.'
              exit 0
            fi
            echo 'Cached native artifacts failed validation; forcing rebuild.'
            rm -rf \
              "$BUILD_DIR/artifacts/adb" \
              "$BUILD_DIR/artifacts/scrcpy" \
              "$BUILD_DIR/artifacts/quic-backend"
          fi
          echo 'reuse=false' >> "$GITHUB_OUTPUT"

      - name: Cache incremental Swift build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/macos-arm64-release/swift
            out/macos-arm64-release/dependency-cache/swiftpm
            .build/public-pins
          key: macos-swift-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'protocol/**', 'macos/**/*.swift', 'macos/**/*.plist', 'macos/**/*.xcprivacy', 'macos/**/*.icns') }}
          restore-keys: |
            macos-swift-v4-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.native.outputs.reuse != 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare native build dependency caches
        if: steps.native.outputs.reuse != 'true'
        run: |
          mkdir -p \
            "$BUILD_DIR/dependency-cache/cargo" \
            "$BUILD_DIR/tools" \
            "$HOME/.rustup/toolchains" \
            "$HOME/.rustup/tmp"

      - name: Cache native build dependencies
        if: steps.native.outputs.reuse != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/macos-arm64-release/dependency-cache/cargo
            out/macos-arm64-release/tools
            ~/.rustup/toolchains
            ~/.rustup/tmp
          key: macos-native-deps-v3-${{ runner.os }}-${{ runner.arch }}-rust1.92.0-ndk29.0.14206865-${{ hashFiles('native/galaxybridge-quic/**/Cargo.lock', 'native/galaxybridge-quic-backend/**/Cargo.lock', 'native/galaxybridge-quic-media/**/Cargo.lock', 'scripts/build-tools-requirements.txt') }}
          restore-keys: |
            macos-native-deps-v3-${{ runner.os }}-${{ runner.arch }}-

      - name: Select native build toolchains
        if: steps.native.outputs.reuse != 'true'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install 1.92.0 --profile minimal
          rustup component add --toolchain 1.92.0 rustfmt
          rustup target add --toolchain 1.92.0 aarch64-apple-darwin aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            'ndk;29.0.14206865'
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          python3 scripts/bootstrap-build-tools.py --build-dir "$BUILD_DIR"
          echo "$PWD/$BUILD_DIR/tools/bin" >> "$GITHUB_PATH"

      - name: Configure CMake
        run: cmake --preset macos-arm64-release -DGB_BUILD_JOBS=4

      - name: Build native artifacts on cache miss
        if: steps.native.outputs.reuse != 'true'
        run: |
          cmake --build --preset macos-arm64-release --target native
          python3 scripts/public-build.py validate-native --build-dir "$BUILD_DIR"
          echo 'GB_REUSE_NATIVE_ARTIFACTS=1' >> "$GITHUB_ENV"

      # Save immediately so a later Swift/packaging failure still seeds the next run.
      - name: Save native artifacts cache
        if: steps.native.outputs.reuse != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/macos-arm64-release/artifacts/adb
            out/macos-arm64-release/artifacts/scrcpy
            out/macos-arm64-release/artifacts/quic-backend
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Fast Swift compatibility check
        run: sh scripts/test-macos-companion-diagnostics.sh

      - name: Build macOS app
        run: |
          # macos-app depends on CMake target native; reuse path only validates.
          test "${GB_REUSE_NATIVE_ARTIFACTS:-}" = 1
          cmake --build --preset macos-arm64-release --target macos-app

      - name: Package macOS DMG
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          # package-macos-direct.py refuses an existing output dir and mkdir's it itself.
          rm -rf out/macos-arm64-release/packages
          python3 scripts/package-macos-direct.py \
            out/macos-arm64-release/artifacts/GalaxyBridge.app \
            out/macos-arm64-release/packages \
            --adb-runtime out/macos-arm64-release/artifacts/adb \
            --release
          find out/macos-arm64-release/packages -type f | sort

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: macos-arm64
          path: out/macos-arm64-release/packages/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: [changes, android, macos]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.code == 'true' &&
      needs.android.result == 'success' &&
      needs.macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find dist -type f \( -name '*.apk' -o -name '*.dmg' -o -name '*.sha256' -o -name '*.signature.txt' -o -name 'SHA256SUMS' \) \
            -exec cp -v {} release-assets/ \;
          ls -la release-assets
          test "$(find release-assets -type f | wc -l)" -gt 0

      - name: Publish continuous GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: continuous
          name: Continuous build
          prerelease: true
          make_latest: true
          body: |
            Latest successful lightweight `main` build.

            - Commit: `${{ github.sha }}`
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Full regression coverage: Nightly Heavy workflow

            Android Direct APK and macOS arm64 DMG are attached below.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
