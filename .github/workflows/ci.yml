name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS + Android
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GB_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.92.0'
      BUILD_DIR: out/macos-arm64-release
      CARGO_HOME: ${{ github.workspace }}/out/macos-arm64-release/dependency-cache/cargo
      GRADLE_USER_HOME: ${{ github.workspace }}/out/macos-arm64-release/dependency-cache/gradle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check publication hygiene
        run: python3 scripts/check-public-tree.py

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Restore dependency caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/macos-arm64-release/dependency-cache
            out/macos-arm64-release/tools
            ~/.rustup/toolchains
            ~/.rustup/tmp
          key: build-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', '**/Cargo.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'scripts/build-tools-requirements.txt') }}
          restore-keys: |
            build-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Select source build toolchains
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          mkdir -p "$BUILD_DIR/dependency-cache/cargo" "$BUILD_DIR/dependency-cache/gradle" "$BUILD_DIR/dependency-cache/swiftpm"
          rustup toolchain install 1.92.0 --profile minimal
          rustup component add --toolchain 1.92.0 rustfmt
          rustup target add --toolchain 1.92.0 aarch64-apple-darwin aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            'ndk;29.0.14206865'
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          python3 scripts/bootstrap-build-tools.py --build-dir "$BUILD_DIR"
          echo "$PWD/$BUILD_DIR/tools/bin" >> "$GITHUB_PATH"

      - name: Configure CMake
        run: cmake --preset macos-arm64-release -DGB_BUILD_JOBS=2

      - name: Check Swift SDK compatibility
        run: sh scripts/test-macos-companion-diagnostics.sh

      - name: Gallery / multishare / tile surface
        run: sh scripts/test-android-gallery-multishare-tile-surface.sh

      - name: Build Android
        run: cmake --build --preset macos-arm64-release --target android-apk

      - name: Build macOS
        run: cmake --build --preset macos-arm64-release --target macos-app

      - name: Run automated checks
        run: cmake --build --preset macos-arm64-release --target check

      - name: Package unsigned development artifacts
        run: cmake --build --preset macos-arm64-release --target package

      - name: List packaged outputs
        run: find out/macos-arm64-release/packages -type f | sort

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: galaxybridge-macos-android-${{ github.sha }}
          path: out/macos-arm64-release/packages/
          if-no-files-found: error
          retention-days: 14
