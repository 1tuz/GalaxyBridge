name: Build macOS

on:
  workflow_call:
    inputs:
      release_artifacts:
        description: Package DMG and upload release artifacts
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GB_BUILD_JOBS: '4'
      RUSTUP_TOOLCHAIN: '1.92.0'
      BUILD_DIR: out/macos-arm64-release
      CARGO_HOME: ${{ github.workspace }}/out/macos-arm64-release/dependency-cache/cargo
      RELEASE_ARTIFACTS: ${{ inputs.release_artifacts || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check publication hygiene
        run: python3 scripts/check-public-tree.py

      # Exact-key only: never restore a partial/stale native binary set.
      - id: native-cache
        name: Restore native artifacts cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/macos-arm64-release/artifacts/adb
            out/macos-arm64-release/artifacts/scrcpy
            out/macos-arm64-release/artifacts/quic-backend
          key: macos-native-v4-${{ runner.os }}-${{ runner.arch }}-rust1.92.0-ndk29.0.14206865-${{ hashFiles('native/galaxybridge-quic/**', 'native/galaxybridge-quic-backend/**', 'native/galaxybridge-quic-media/**', 'third_party/adb-owned/**', 'third_party/scrcpy/**', 'third_party/scrcpy-gb-sync/**', 'scripts/build-owned-adb.sh', 'scripts/build-quic-backend.sh', 'scripts/build-scrcpy-gb-sync.sh', 'scripts/native-build-env.sh', 'scripts/stage-redistributable-adb.py') }}

      - id: native
        name: Validate cached native artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR/artifacts"
          if [[ "${{ steps.native-cache.outputs.cache-hit }}" == 'true' ]]; then
            if python3 scripts/public-build.py validate-native --build-dir "$BUILD_DIR"; then
              echo 'reuse=true' >> "$GITHUB_OUTPUT"
              echo 'GB_REUSE_NATIVE_ARTIFACTS=1' >> "$GITHUB_ENV"
              echo 'Validated native cache hit; skipping Java/Android SDK/NDK/Rust toolchains.'
              exit 0
            fi
            echo 'Cached native artifacts failed validation; forcing rebuild.'
            rm -rf \
              "$BUILD_DIR/artifacts/adb" \
              "$BUILD_DIR/artifacts/scrcpy" \
              "$BUILD_DIR/artifacts/quic-backend"
          fi
          echo 'reuse=false' >> "$GITHUB_OUTPUT"

      - name: Cache incremental Swift build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/macos-arm64-release/swift
            out/macos-arm64-release/dependency-cache/swiftpm
            .build/public-pins
          key: macos-swift-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'protocol/**', 'macos/**/*.swift', 'macos/**/*.plist', 'macos/**/*.xcprivacy', 'macos/**/*.icns') }}
          restore-keys: |
            macos-swift-v4-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.native.outputs.reuse != 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare native build dependency caches
        if: steps.native.outputs.reuse != 'true'
        run: |
          mkdir -p \
            "$BUILD_DIR/dependency-cache/cargo" \
            "$BUILD_DIR/tools" \
            "$HOME/.rustup/toolchains" \
            "$HOME/.rustup/tmp"

      - name: Cache native build dependencies
        if: steps.native.outputs.reuse != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/macos-arm64-release/dependency-cache/cargo
            out/macos-arm64-release/tools
            ~/.rustup/toolchains
            ~/.rustup/tmp
          key: macos-native-deps-v3-${{ runner.os }}-${{ runner.arch }}-rust1.92.0-ndk29.0.14206865-${{ hashFiles('native/galaxybridge-quic/**/Cargo.lock', 'native/galaxybridge-quic-backend/**/Cargo.lock', 'native/galaxybridge-quic-media/**/Cargo.lock', 'scripts/build-tools-requirements.txt') }}
          restore-keys: |
            macos-native-deps-v3-${{ runner.os }}-${{ runner.arch }}-

      - name: Select native build toolchains
        if: steps.native.outputs.reuse != 'true'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install 1.92.0 --profile minimal
          rustup component add --toolchain 1.92.0 rustfmt
          rustup target add --toolchain 1.92.0 aarch64-apple-darwin aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            'ndk;29.0.14206865'
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          python3 scripts/bootstrap-build-tools.py --build-dir "$BUILD_DIR"
          echo "$PWD/$BUILD_DIR/tools/bin" >> "$GITHUB_PATH"

      - name: Configure CMake
        run: cmake --preset macos-arm64-release -DGB_BUILD_JOBS=4

      - name: Build native artifacts on cache miss
        if: steps.native.outputs.reuse != 'true'
        run: |
          cmake --build --preset macos-arm64-release --target native
          python3 scripts/public-build.py validate-native --build-dir "$BUILD_DIR"
          echo 'GB_REUSE_NATIVE_ARTIFACTS=1' >> "$GITHUB_ENV"

      # Save immediately so a later Swift/packaging failure still seeds the next run.
      - name: Save native artifacts cache
        if: steps.native.outputs.reuse != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/macos-arm64-release/artifacts/adb
            out/macos-arm64-release/artifacts/scrcpy
            out/macos-arm64-release/artifacts/quic-backend
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Fast Swift compatibility check
        run: sh scripts/test-macos-companion-diagnostics.sh

      - name: Build macOS app
        run: |
          # macos-app depends on CMake target native; reuse path only validates.
          test "${GB_REUSE_NATIVE_ARTIFACTS:-}" = 1
          cmake --build --preset macos-arm64-release --target macos-app

      - name: Package macOS DMG
        if: env.RELEASE_ARTIFACTS == 'true'
        shell: bash
        run: |
          # package-macos-direct.py refuses an existing output dir and mkdir's it itself.
          rm -rf out/macos-arm64-release/packages
          python3 scripts/package-macos-direct.py \
            out/macos-arm64-release/artifacts/GalaxyBridge.app \
            out/macos-arm64-release/packages \
            --adb-runtime out/macos-arm64-release/artifacts/adb \
            --release
          find out/macos-arm64-release/packages -type f | sort

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.RELEASE_ARTIFACTS == 'true'
        with:
          name: macos-arm64
          path: out/macos-arm64-release/packages/
          if-no-files-found: error
          retention-days: 14
